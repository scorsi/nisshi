[workspace]
resolver = "3"
members = ["crates/nisshi-core", "crates/nisshi", "crates/nisshi-store", "crates/nisshi-testpush"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"

# Direct dependencies are limited to ADR 0015.
[workspace.dependencies]
nisshi-core = { path = "crates/nisshi-core" }
hyper = { version = "1", features = ["server", "http1", "client"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.13"
prost-build = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "fs", "time", "signal", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
zstd = "0.14"
